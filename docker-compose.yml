version: '3.9'

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5588
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile  # whatever your backend Dockerfile is named
    container_name: node_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # IMPORTANT: use `db` as host, NOT localhost
      DATABASE_URL: postgresql://postgres:5588@localhost:5432/library_db
    depends_on:
      - db
    ports:
      - "5000:5000"

volumes:
  db_data:
